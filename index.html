<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Préstamos - Biblioteca</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --danger-color: #dc2626;
      --danger-hover: #b91c1c;
      --text-color: #1e293b;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-color: #1e293b;
      background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
                        url('https://i.postimg.cc/vHLVQjRN/fondo.jpg');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .main-wrapper {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 960px;
      align-items: flex-start;
      justify-content: center;
    }

    @media (max-width: 820px) {
      .main-wrapper {
        flex-direction: column-reverse;
        align-items: center;
      }
    }

    /* Panel Izquierdo */
    .panel-lista {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid #e2e8f0;
    }

    .panel-lista h2 {
      font-size: 1.3rem;
      color: #0f172a;
      margin-bottom: 18px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .lista-contenedor {
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .estado-lista {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      padding: 20px 0;
    }

    .item-prestamo {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--primary-color);
      padding: 12px 14px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-prestamo .titulo {
      font-weight: 600;
      color: #0f172a;
      font-size: 0.95rem;
    }

    .item-prestamo .meta {
      font-size: 0.82rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }

    .btn-devolver {
      margin-top: 4px;
      padding: 6px 12px;
      background-color: var(--danger-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
      width: auto;
      transition: background-color 0.2s;
    }

    .btn-devolver:hover {
      background-color: var(--danger-hover);
    }

    /* Panel Derecho */
    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 460px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid #e2e8f0;
    }

    .container h1 {
      margin-bottom: 6px;
      color: #0f172a;
      font-size: 1.6rem;
      text-align: center;
    }

    .container p.subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: var(--text-color);
    }

    input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input::placeholder {
      color: #94a3b8 !important;
      -webkit-text-fill-color: #94a3b8 !important;
      font-weight: 400;
      opacity: 1;
    }

    input[readonly] {
      background-color: #f8fafc;
      opacity: 1;
    }

    button.btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button.btn-submit:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #94a3b8 !important;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .status-msg.success {
      display: block;
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .status-msg.error {
      display: block;
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .status-msg.info {
      display: block;
      background-color: #e0f2fe;
      color: #075985;
      border: 1px solid #bae6fd;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="panel-lista">
      <h2>📖 Libros Prestados</h2>
      <div id="contenedorLista" class="lista-contenedor">
        <p class="estado-lista">Cargando lista de préstamos...</p>
      </div>
    </div>

    <div class="container">
      <h1>📚 Registro de Préstamos</h1>
      <p class="subtitle">Gestión de Biblioteca</p>

      <form id="formPrestamo">
        <div class="form-group">
          <label for="codigo">Código del Libro</label>
          <input type="text" id="codigo" name="codigo" placeholder="Ingresa o escanea el código" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="libro">Título del Libro</label>
          <input type="text" id="libro" name="libro" placeholder="Se completará automáticamente" required readonly>
        </div>

        <div class="form-group">
          <label for="correo">Correo del Solicitante</label>
          <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="fecha">Fecha de Devolución</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">Registrar Préstamo</button>
      </form>

      <div id="mensaje" class="status-msg"></div>
    </div>
  </div>

  <script>
    const inputCodigo = document.getElementById('codigo');
    const inputLibro = document.getElementById('libro');
    const form = document.getElementById('formPrestamo');
    const mensaje = document.getElementById('mensaje');
    const btnSubmit = document.getElementById('btnSubmit');

    window.addEventListener('DOMContentLoaded', cargarListaPrestamos);

    inputCodigo.addEventListener('blur', buscarLibro);
    inputCodigo.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        buscarLibro();
      }
    });

    function cargarListaPrestamos() {
      const contenedor = document.getElementById('contenedorLista');

      google.script.run
        .withSuccessHandler(function(prestamos) {
          if (!prestamos || prestamos.length === 0) {
            contenedor.innerHTML = '<p class="estado-lista">No hay préstamos activos registrados.</p>';
            return;
          }

          contenedor.innerHTML = '';
          prestamos.forEach(function(item) {
            const div = document.createElement('div');
            div.className = 'item-prestamo';
            div.innerHTML = `
              <div class="titulo">${item.libro || 'Sin título'}</div>
              <div class="meta">
                <span><strong>Cód:</strong> ${item.codigo}</span>
                <span><strong>Devolver:</strong> ${item.fecha || '-'}</span>
              </div>
              <div class="meta">
                <span>📧 ${item.correo}</span>
              </div>
              <button class="btn-devolver" onclick="devolverLibro(${item.fila}, this)">↩️ Devolver</button>
            `;
            contenedor.appendChild(div);
          });
        })
        .withFailureHandler(function() {
          contenedor.innerHTML = '<p class="estado-lista" style="color:#991b1b;">Error al cargar préstamos.</p>';
        })
        .obtenerPrestamosEnServer();
    }

    function devolverLibro(fila, boton) {
      if (!confirm('¿Confirmas que este libro ha sido devuelto?')) return;

      boton.disabled = true;
      boton.textContent = 'Procesando...';

      google.script.run
        .withSuccessHandler(function(res) {
          if (res === 'Éxito') {
            mostrarMensaje('✅ Libro devuelto y registrado correctamente.', 'success');
            cargarListaPrestamos();
          } else {
            boton.disabled = false;
            boton.textContent = '↩️ Devolver';
            mostrarMensaje('Error al procesar devolución: ' + res, 'error');
          }
        })
        .withFailureHandler(function(err) {
          boton.disabled = false;
          boton.textContent = '↩️ Devolver';
          mostrarMensaje('Error de conexión: ' + err.message, 'error');
        })
        .devolverLibroEnServer(fila);
    }

    function buscarLibro() {
      const codigoVal = inputCodigo.value.trim();
      if (!codigoVal) return;

      mostrarMensaje('Buscando libro en inventario...', 'info');

      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.encontrado) {
            inputLibro.value = res.titulo;
            ocultarMensaje();
          } else {
            inputLibro.value = '';
            mostrarMensaje('❌ Libro no encontrado en el inventario.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          mostrarMensaje('Error en servidor: ' + err.message, 'error');
        })
        .buscarLibroEnServer(codigoVal);
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      if (!inputLibro.value) {
        mostrarMensaje('Por favor, ingresa un código de libro válido.', 'error');
        return;
      }

      btnSubmit.disabled = true;
      mostrarMensaje('Guardando préstamo...', 'info');

      const datosForm = {
        codigo: document.getElementById('codigo').value,
        libro: document.getElementById('libro').value,
        correo: document.getElementById('correo').value,
        fecha: document.getElementById('fecha').value
      };

      google.script.run
        .withSuccessHandler(function(res) {
          btnSubmit.disabled = false;
          if (res.includes('Éxito')) {
            mostrarMensaje('✅ Préstamo registrado con éxito.', 'success');
            form.reset();
            cargarListaPrestamos();
          } else {
            mostrarMensaje('Error al registrar: ' + res, 'error');
          }
        })
        .withFailureHandler(function(err) {
          btnSubmit.disabled = false;
          mostrarMensaje('Error de conexión: ' + err.message, 'error');
        })
        .registrarPrestamoEnServer(datosForm);
    });

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = 'status-msg ' + tipo;
    }

    function ocultarMensaje() {
      mensaje.style.display = 'none';
      mensaje.className = 'status-msg';
    }
  </script>

</body>
</html>
